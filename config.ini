; ==========================================================
;  TIPOS TRACKER SETTINGS  —  edit with Notepad/Editor
; ==========================================================

[settings]

; The website to screenshot
url = https://www.oddset.de/de/sports/live/alle

; Short name used in the screenshot filenames (no spaces)
site_name = Oddset Live

; --- Schedule (used only when running on your PC) ---
; On GitHub the timing comes from the workflow's cron line instead.
run_daily_at = 07:00
run_every_minutes =

; Where screenshots are saved. On GitHub keep this as "output".
output_folder = output

; VPN country check. Empty = off (Tipos opens without a VPN).
require_country =

; Show the browser window while shooting? (yes/no)
show_browser = no

; Use the saved login session? Keep "no" unless you did --login.
use_saved_session = no

; --- Image ---
; jpeg = small files (recommended). png = sharper text, bigger files.
image_format = jpeg
jpeg_quality = 85
max_height = 8000

; --- TOP-ONLY CAPTURE ---
; Only screenshot the top part of the page (the slots grid), not the
; whole long page. The number is the height in pixels from the top.
; Increase it to include more rows, decrease it to show fewer.
; Set to 0 to capture the full page instead.
capture_height = 500
